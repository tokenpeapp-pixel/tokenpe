<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <!-- Blue token gradient (matches the original icon) -->
    <linearGradient id="clBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083E82" />
      <stop offset="100%" stop-color="#00183A" />
    </linearGradient>
    <linearGradient id="clPeopleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00D05A" />
    </linearGradient>
    <filter id="clShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Icon: Blue squircle with T and people glyphs (scaled to ~110px height) -->
  <g transform="translate(4, 4) scale(0.215)">
    <rect x="40" y="60" width="412" height="412" rx="100" fill="url(#clBgGrad)" filter="url(#clShadow)" />
    <!-- T shape -->
    <rect x="224" y="165" width="64" height="150" rx="32" fill="#FFFFFF" />
    <rect x="116" y="145" width="280" height="60" rx="30" fill="#FFFFFF" />
    <!-- Three people -->
    <path d="M 142 450 C 142 385, 242 385, 242 450 Z" fill="url(#clPeopleGrad)" />
    <circle cx="192" cy="335" r="20" fill="url(#clPeopleGrad)" />
    <path d="M 270 450 C 270 385, 370 385, 370 450 Z" fill="url(#clPeopleGrad)" />
    <circle cx="320" cy="335" r="20" fill="url(#clPeopleGrad)" />
    <path d="M 200 455 C 200 375, 312 375, 312 455 Z" fill="url(#clPeopleGrad)" />
    <circle cx="256" cy="320" r="23" fill="url(#clPeopleGrad)" />
    <!-- Badge -->
    <g filter="url(#clShadow)">
      <circle cx="380" cy="110" r="48" fill="#00D05A" />
      <circle cx="380" cy="110" r="44" fill="url(#clPeopleGrad)" />
      <text x="380" y="127" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="50" font-weight="900" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- Wordmark: dark "Token" + green "Pe" — readable on white -->
  <text x="118" y="72" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="58" font-weight="900" letter-spacing="-2">
    <tspan fill="#0d2b1e">Token</tspan><tspan fill="#059669">Pe</tspan>
  </text>

  <!-- Subtle tagline -->
  <text x="120" y="95" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" letter-spacing="-0.2">Smart Queue. Better Care.</text>
</svg>
